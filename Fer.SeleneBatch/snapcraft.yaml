name: fer-selenebatch
base: core24                                   # 1. Actualizado a core24 para soporte nativo de .NET 8 / Ubuntu 24.04
version: '0.9.0'
summary: Media converter via batch.
description: |
  Media converter via batch.

grade: stable
confinement: strict

apps:
  fer-selenebatch:
    command: Fer.SeleneBatch                  # 2. Mayúsculas corregidas para coincidir exactamente con el ejecutable C#
    extensions:
      - gnome
    plugs:
      - home
      - network
      - x11

parts:
  fer-selenebatch:
    plugin: dump
    source: Fer.SeleneBatch/bin/Release/net8.0/linux-x64/publish # 3. Ruta corregida según la estructura de la solución
    source-type: local                         # 4. Forzado tipo 'local' para evitar fallos de resolución en LXD
    build-packages:
      - libgdk-pixbuf-2.0-dev